<!DOCTYPE html>
<html lang="fr">
<head>

    <link rel="stylesheet" href="logiciel/css/style_base.css">

            <div id="util_alertes_ecarts" class="vue-section section-cachee"></div>

            <div id="util_alertes_mails_pros" class="vue-section section-cachee"></div>
            <div id="faq" class="vue-section section-cachee"></div>
            <div id="infos" class="vue-section section-cachee"></div>
        </main>
    </div>

    <script src="logiciel/lib/xlsx.full.min.js"></script>
    <script src="logiciel/config/infos.js"></script>
    <script src="logiciel/config/menu.js"></script>
    <script src="logiciel/config/modele_mail.js"></script>
    <script src="logiciel/utilitaires/util_modal_cci.js"></script>
    <script src="logiciel/utilitaires/util_excel.js"></script>
    <script src="logiciel/utilitaires/util_point_orga.js"></script>
    <script src="logiciel/utilitaires/util_com_orga.js"></script>

    <script src="logiciel/utilitaires/util_alertes_retraites.js"></script>
    <script src="logiciel/utilitaires/util_alertes_mails_pros.js"></script>

    <script src="logiciel/utilitaires/util_faq.js"></script>
    <script src="logiciel/utilitaires/util_infos.js"></script>
